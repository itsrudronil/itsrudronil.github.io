<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEXUS Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="grid-bg"></div>

<!-- APP -->
<main id="app">
  <header class="top">
    <h1 class="logo small">NEXUS<span>player</span></h1>
    <nav class="tabs">
      <button class="tab active" data-mode="live">Live</button>
      <button class="tab" data-mode="vod">Movies</button>
    </nav>
  </header>

  <section class="stage">
    <div class="screen">
      <video id="video" controls playsinline></video>
      <div id="nowPlaying" class="now">Pick a channel to start</div>
    </div>
  </section>

  <section class="browser">
    <input id="search" class="search" type="search" placeholder="Search channels…">
    <div id="cats" class="cats"></div>
    <div id="list" class="list"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script src="index.js"></script>
</body>
</html>
